<!DOCTYPE html>
<html lang="en" data-lynn-theme="lynn" class="hub-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiCE UX Hub</title>
  <meta name="description" content="One place for every site built by the NiCE UX team." />
  <link rel="stylesheet" href="vendor/lynn-ui/dist/lynn-ui.css?v=2" />
  <link rel="stylesheet" href="assets/hub.css?v=6" />
  <script>try{var t=localStorage.getItem('ux-hub-theme');if(t)document.documentElement.setAttribute('data-lynn-theme',t)}catch(e){}</script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "scheduler": "https://esm.sh/scheduler@0.23.2",
      "matter-js": "https://esm.sh/matter-js@0.20.0"
    }
  }
  </script>
  <!-- Hold the paint until React mounts; a 4s failsafe keeps the page readable if the CDN is down. -->
  <style>html.hub-pending body{visibility:hidden}</style>
  <script>setTimeout(function(){document.documentElement.classList.remove('hub-pending')},4000)</script>
</head>
<body>
  <div id="app"></div>
  <noscript>The UX Hub needs JavaScript. Try the Lyra, Designer Suite and SOL Storybook links in the README.</noscript>
  <script src="assets/sites.js?v=5"></script>
  <script type="module" src="assets/app.js?v=6"></script>
</body>
</html>
